specification: API Commons Conformance
specificationVersion: '0.1'
provider: CCPA (California Consumer Privacy Act)
providerId: ccpa
generated: '2026-09-05'
method: searched
source: >-
  openapi/ccpa-drop-databroker-api.yml, well-known/ccpa-gpc.json (live 200 probe),
  https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/, and the
  specification repositories this index already tracks.
description: >-
  Standards and cross-cutting conventions this regulatory surface does and does not
  conform to. Each entry names the SUBJECT it applies to, because this record indexes four
  distinct surfaces (the CalPrivacy DROP API, the GPC browser signal, the IAB Tech Lab GPP
  string, and the CPPA data broker registry) and a conformance true for one is not a
  conformance true for the others.
conformance:
  - id: openapi-3.1
    subject: ccpa:drop-data-broker-api
    conforms: true
    evidence: >-
      openapi/ccpa-drop-databroker-api.yml declares openapi: 3.1.0 and parses; fetched
      HTTP 200 from https://dropresources.blob.core.windows.net/apidocs/databroker_api.yaml,
      linked as "Download API Specification (OpenAPI YAML)" from
      https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/
  - id: rfc9457
    subject: ccpa:drop-data-broker-api
    conforms: false
    evidence: >-
      No application/problem+json anywhere in the spec. Errors use hand-rolled
      MessageResponse/UploadResponse JSON, and 401 returns text/plain (live probe
      2026-09-05).
  - id: idempotency
    subject: ccpa:drop-data-broker-api
    conforms: false
    evidence: >-
      No idempotency key or replay-protection header on either mutating operation. See
      conventions/ccpa-conventions.yml idempotency.coverage = none.
  - id: pagination
    subject: ccpa:drop-data-broker-api
    conforms: false
    evidence: >-
      Not applicable — a single ZIP archive is returned, with no page/cursor/limit
      parameters and no collection endpoints.
  - id: oauth2
    subject: ccpa:drop-data-broker-api
    conforms: false
    evidence: >-
      components.securitySchemes declares only ApiKeyAuth (apiKey, header, X-API-KEY).
      No OAuth 2.0, no OpenID Connect, no scopes surface.
  - id: rfc8594-deprecation
    subject: ccpa:drop-data-broker-api
    conforms: false
    evidence: No Sunset or Deprecation headers; no deprecation policy published.
  - id: rfc9116-security-txt
    subject: ca.gov (parent domain of api.drop.privacy.ca.gov and privacy.ca.gov)
    conforms: true
    evidence: >-
      https://ca.gov/.well-known/security.txt returned HTTP 200 with Contact, Expires,
      Policy, Hiring, Preferred-Languages and Canonical fields. Saved verbatim to
      well-known/ccpa-security.txt.
  - id: webhook-hmac-sha256-signing
    subject: ccpa:drop-data-broker-api
    conforms: true
    evidence: >-
      The published webhook contract signs each delivery with HMAC-SHA256 over
      `<X-Webhook-Timestamp>.<raw body>`, delivered as X-Webhook-Signature: sha256=<hex>,
      with a recommended 5-minute replay window. See asyncapi/ccpa-drop-webhooks.yml.
  - id: asyncapi
    subject: ccpa:drop-data-broker-api
    conforms: false
    evidence: >-
      A real webhook surface exists and is documented, but no AsyncAPI document is
      published for it.
domain_standards:
  - id: global-privacy-control
    name: Global Privacy Control (GPC)
    subject: ccpa:global-privacy-control
    conforms: true
    signature: >-
      The GPC support resource at /.well-known/gpc.json, the discovery document the GPC
      specification itself defines.
    evidence: >-
      https://globalprivacycontrol.org/.well-known/gpc.json returned HTTP 200 with
      {"gpc": true, "lastUpdate": "2021-05-13"}. Saved verbatim to
      well-known/ccpa-gpc.json. Specification draft at https://privacycg.github.io/gpc-spec/
      (HTTP 200).
    regulatory_significance: >-
      The California Attorney General has affirmed that GPC must be honored as a valid
      CCPA "Do Not Sell or Share" opt-out request, which makes this well-known document a
      compliance mechanism rather than merely a convention.
  - id: iab-gpp
    name: IAB Tech Lab Global Privacy Platform (GPP)
    subject: ccpa:iab-gpp
    conforms: true
    signature: >-
      The GPP consent string and its US-state sections, encoded and decoded by the IAB
      Tech Lab reference implementation (@iabgpp/cmpapi, @iabgpp/stub — see
      packages/ccpa-packages.yml).
    evidence: >-
      https://iabtechlab.com/gpp/ (HTTP 200) and the specification repository
      https://github.com/InteractiveAdvertisingBureau/Global-Privacy-Platform (HTTP 200,
      last pushed 2026-08-06). Successor to the US Privacy (USP) string at
      https://github.com/InteractiveAdvertisingBureau/USPrivacy (HTTP 200).
  - id: california-delete-act
    name: California Delete Act (Civil Code 1798.99.80 et seq.) / CCR title 11 section 7600
    subject: ccpa:drop-data-broker-api
    conforms: true
    signature: >-
      The DROP Data Broker API is the statutory implementation surface — its four status
      codes (2 Exempted / 3 Deleted / 4 Opted out / 5 Not found) are the reporting
      vocabulary the regulation requires, and its list types are the identifier classes
      the regulation covers.
    evidence: >-
      openapi/ccpa-drop-databroker-api.yml info.summary "Delete Act - Data Broker
      Integration API"; the integration-workflow page cites Civil Code 1798.99.80 et seq.
      and CCR title 11 section 7600 for timelines
      (https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/integration-workflow/,
      HTTP 200).
  - id: sha-256-base64-identifier-hashing
    name: SHA-256 / Base64 standardized identifier hashing
    subject: ccpa:drop-data-broker-api
    conforms: true
    signature: >-
      All consumer identifiers are exchanged only as SHA-256 hashes with UTF-8 input and
      Base64 output, over per-identifier standardization rules published by CalPrivacy,
      with composite hashing for NDZ and NameVIN.
    evidence: >-
      https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/working-with-data/
      (HTTP 200) and the HashBase64 schema in openapi/ccpa-drop-databroker-api.yml.
certifications: []
certifications_note: >-
  None. CalPrivacy is the regulator; it publishes no SOC 2 / ISO 27001 / FedRAMP trust
  center for DROP, and no trust center was found on any host probed. No `Compliance`
  pointer is emitted, because there is no published certification program to point at.
