description: >-
  The California Consumer Privacy Act (CCPA), amended by the California
  Privacy Rights Act (CPRA), is a state statute that grants California
  residents rights over their personal information: the right to know,
  delete, correct, opt-out of sale/sharing, limit use of sensitive personal
  information, and non-discrimination for exercising privacy rights. It is
  enforced by the California Privacy Protection Agency (CPPA) and the
  California Attorney General. Technical interoperability mechanisms
  include the Global Privacy Control (GPC) browser signal and the IAB Tech
  Lab US Privacy (USP) / Global Privacy Platform (GPP) signals for
  advertising technology. This index tracks the official regulatory
  resources, technical privacy signals, and commercial APIs that help
  businesses comply with CCPA/CPRA obligations.
apis:
  - aid: ccpa:global-privacy-control
    name: Global Privacy Control (GPC) Specification
    tags:
      - Browser Signal
      - Opt-Out
      - Standard
    humanURL: https://globalprivacycontrol.org/
    properties:
      - url: https://globalprivacycontrol.org/
        type: Website
      - url: https://privacycg.github.io/gpc-spec/
        type: Specification
      - url: https://github.com/privacycg/gpc-spec
        type: SourceCode
    description: >-
      Global Privacy Control is a browser-level signal that communicates a
      user's opt-out preference to websites. The California Attorney
      General has affirmed that GPC must be treated as a valid CCPA
      "Do Not Sell or Share" opt-out request.
  - aid: ccpa:iab-gpp
    name: IAB Tech Lab Global Privacy Platform (GPP)
    tags:
      - AdTech
      - Consent
      - IAB
      - Signals
    humanURL: https://iabtechlab.com/gpp/
    properties:
      - url: https://iabtechlab.com/gpp/
        type: Documentation
      - url: https://github.com/InteractiveAdvertisingBureau/Global-Privacy-Platform
        type: SourceCode
      - url: https://github.com/InteractiveAdvertisingBureau/USPrivacy
        type: LegacySpec
      - url: packages/ccpa-packages.yml
        type: Packages
      - url: packages/ccpa-packages.yml
        type: SDKs
    description: >-
      The IAB Tech Lab Global Privacy Platform (GPP) is the successor to
      the US Privacy (USP) string. It provides a standardized way to
      communicate user consent and opt-out signals between publishers,
      consent management platforms, and adtech vendors for CCPA, CPRA, and
      other jurisdictions.
  - aid: ccpa:cppa-enforcement-resources
    name: California Privacy Protection Agency (CPPA) Resources
    tags:
      - Enforcement
      - Regulations
      - Rulemaking
    tags_raw:
      - Enforcement
      - Regulation
      - Rulemaking
    humanURL: https://cppa.ca.gov/
    properties:
      - url: https://cppa.ca.gov/
        type: Website
      - url: https://cppa.ca.gov/regulations/
        type: Regulations
    description: >-
      Official resources from the California Privacy Protection Agency, the
      body empowered by CPRA to implement, enforce, and publish regulations
      under the CCPA.
  - aid: ccpa:ca-data-broker-registry
    name: California Data Broker Registry
    tags:
      - Data Brokers
      - Registry
    humanURL: https://oag.ca.gov/data-brokers
    properties:
      - url: https://oag.ca.gov/data-brokers
        type: Registry
      - url: 
          https://privacy.ca.gov/drop-for-data-brokers/account-creation-fees-and-annual-registration/
        type: Registration
    description: >-
      Official California Attorney General registry of data brokers
      required to register under Civil Code section 1798.99.80, providing
      a public list that consumers can use to submit opt-out requests.
  - aid: ccpa:drop-data-broker-api
    name: CalPrivacy DROP Data Broker API
    tags:
      - Data Brokers
      - Delete Act
      - Deletion Requests
      - DROP
      - Regulator API
    humanURL: https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/
    baseURL: https://api.drop.privacy.ca.gov
    properties:
      - url: openapi/ccpa-drop-databroker-api.yml
        type: OpenAPI
      - url: https://dropresources.blob.core.windows.net/apidocs/databroker_api.yaml
        type: Specification
      - url: https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/
        type: Documentation
      - url: 
          https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/api-operations/
        type: APIReference
      - url: 
          https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/getting-started/
        type: GettingStarted
      - url: 
          https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/integration-workflow/
        type: Documentation
      - url: 
          https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/working-with-data/
        type: Documentation
      - url: 
          https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/reference/
        type: Reference
      - url: https://databroker.drop.privacy.ca.gov/
        type: Portal
    description: >-
      The Delete Request and Opt-out Platform (DROP) Data Broker API is the statutory integration
      surface California's Delete Act requires of every registered data broker. Brokers call
      GET /data/download to retrieve a ZIP of CSV files holding SHA-256 hashed consumer deletion
      identifiers, match those hashes against their own records, act, then report a status
      per work item with POST /data/upload (2 Exempted, 3 Deleted, 4 Opted out, 5 Not found),
      correcting a prior filing with POST /data/amend. Operated by the California Privacy
      Protection Agency (CalPrivacy), authenticated with an X-API-KEY issued in the Data Broker
      Portal after annual registration and fee payment. OpenAPI 3.1.0, description version
      1.2.0. Processing became mandatory for registered brokers on 2026-08-01.
