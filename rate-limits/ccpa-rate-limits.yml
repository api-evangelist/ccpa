specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CCPA (California Consumer Privacy Act)
providerId: ccpa
api: ccpa:drop-data-broker-api
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: >-
  https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/api-operations/
description: >-
  Published throttling behaviour for the CalPrivacy DROP Data Broker API. This artifact
  replaces a 2026-05-04 bulk-sweep scaffold that carried invented X-RateLimit-* headers and
  invented per-tier quotas for a provider that publishes neither. CalPrivacy documents the
  EXISTENCE of throttling and a retry interval, but publishes no numeric limit.
tags:
  - CCPA
  - CPRA
  - Delete Act
  - DROP
  - Rate Limiting
limit_count: 0
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: Retry-After
header_note: >-
  No X-RateLimit-* or RFC 9238 RateLimit-* headers are documented or observed. Retry-After
  IS declared in the OpenAPI — but on the 202 "download package is being prepared" response
  of GET /data/download, NOT on 429. There is therefore no runtime budget signal an agent
  can read: a caller learns it is over the limit only by being refused.
exhaustion:
  status: 429
  title: Too Many Requests
  body: Not documented.
  guidance: 'Wait 30 seconds and retry.'
  source: https://privacy.ca.gov/drop-for-data-brokers/technical-specifications/api-operations/
polling:
  operation: downloadData
  status: 202
  header: Retry-After
  detail: >-
    The intended call pattern is prepare-then-poll: GET /data/download returns 202 with
    Retry-After while the ZIP is built, and the caller repeats the same GET. Respecting
    Retry-After on 202 is the primary way to avoid the 429 path.
concurrency:
  detail: >-
    Enforced by state, not by a counter. GET /data/download returns 409 "Previous download
    is not complete" and POST /data/upload returns 409 "No active download is waiting for
    responses", which serialises a broker to one active download/upload cycle at a time.
notes: >-
  Access is gated by statutory registration and an annual fee rather than by a usage tier,
  so there is no free/paid limit ladder to record. See plans/ccpa-plans-pricing.yml.
